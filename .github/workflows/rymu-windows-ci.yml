name: Rymu Windows source build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Source build or isolated submitted-MSIX registration test
        required: true
        default: source-build
        type: choice
        options:
          - source-build
          - store-msix-smoke
      draft_release_id:
        description: Existing internal draft release ID, only for Store smoke
        required: false
        type: string
      package_input:
        description: Store test input; public MSI reconstructs identical payload, not original archive
        required: true
        default: draft-msix
        type: choice
        options:
          - draft-msix
          - public-msi-payload
      draft_asset_id:
        description: Exact submitted MSIX draft asset ID, only for Store smoke
        required: false
        type: string
      version:
        description: Unpublished three-part MSI qualification version
        required: true
        default: '0.1.15'
        type: string
      upload_artifacts:
        description: Enable only after confirming free artifact storage allowance
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.mode == 'store-msix-smoke' && 'rymu-store-msix-smoke' || 'rymu-windows-source' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: inputs.mode != 'store-msix-smoke'
    # Standard hosted runner only; no larger or self-hosted runners.
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CI_RELEASE_VERSION: ${{ inputs.version }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
      CARGO_TERM_COLOR: never
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source line endings on the disposable runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out the reviewed source and pinned submodule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.8'
          architecture: x64
      - name: Verify exact public source baseline and CI inputs
        run: |
          python rymu-release/ci/test_verify_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rymu-release/ci/test_collect_vcpkg_notices.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rymu-release/ci/verify_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & rymu-release/ci/windows-build.ps1 -Stage Validate -Version $env:CI_RELEASE_VERSION
      - name: Bootstrap hash-locked tools and native libraries
        run: '& rymu-release/ci/windows-build.ps1 -Stage Bootstrap -Version $env:CI_RELEASE_VERSION'
      - name: Build Rust and Flutter from this checkout
        run: '& rymu-release/ci/windows-build.ps1 -Stage Build -Version $env:CI_RELEASE_VERSION'
      - name: Run focused native and Flutter tests
        run: '& rymu-release/ci/windows-build.ps1 -Stage Test -Version $env:CI_RELEASE_VERSION'
      - name: Package and verify the unsigned MSI
        run: '& rymu-release/ci/windows-build.ps1 -Stage Package -Version $env:CI_RELEASE_VERSION'
      - name: Record source, tool and output provenance
        run: '& rymu-release/ci/windows-build.ps1 -Stage Evidence -Version $env:CI_RELEASE_VERSION'
      - name: Upload unsigned qualification artifact
        if: inputs.upload_artifacts
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rymu-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rymu-release/out/*.msi
            rymu-release/out/*.zip
            rymu-release/out/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve diagnostics, including failures
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rymu-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rymu-release/out/logs/
            rymu-release/out/*.json
          if-no-files-found: ignore
          retention-days: 1

  store-msix-smoke:
    if: inputs.mode == 'store-msix-smoke'
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve reviewed line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out reviewed test logic and exact source metadata
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Verify test guards and reviewed input hashes
        run: |
          & rymu-release/ci/test_store_msix_smoke.ps1
          python rymu-release/ci/verify_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & rymu-release/ci/store-msix-smoke.ps1 -Stage Validate
      - name: Prove read-only access to the exact unpublished draft asset
        if: inputs.package_input != 'public-msi-payload'
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
          DRAFT_ASSET_ID: ${{ inputs.draft_asset_id }}
        run: '& rymu-release/ci/store-msix-smoke.ps1 -Stage Download -ReleaseId $env:DRAFT_RELEASE_ID -AssetId $env:DRAFT_ASSET_ID'
      - name: Reconstruct all 100 exact payload files from the immutable public MSI
        if: inputs.package_input == 'public-msi-payload'
        run: '& rymu-release/ci/store-msix-smoke.ps1 -Stage Reconstruct -PackageInput public-msi-payload'
      - name: Register and remove a payload-identical test-signed copy on Server 2025
        shell: powershell
        env:
          PACKAGE_INPUT: ${{ inputs.package_input }}
        run: '& rymu-release/ci/store-msix-smoke.ps1 -Stage Install -PackageInput $env:PACKAGE_INPUT'
      # No artifact upload, release publication, account sign-in, app launch or WACK claim.
      # The VM, test-signed copy and ephemeral certificate must never leave this job.

# Source mode builds unsigned qualification evidence. Store smoke only test-signs
# a disposable VM copy; neither mode signs for distribution, publishes, enables
# paid services, or asserts SignPath acceptance. After acceptance,
# a reviewed signing job can use the unsigned step's artifact-id with the approved
# project/policy and mandatory human approval. Do not import local installer files.
