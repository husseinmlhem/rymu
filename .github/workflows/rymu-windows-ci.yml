name: Rymu Windows source build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unpublished three-part MSI qualification version
        required: true
        default: '0.1.15'
        type: string
      upload_artifacts:
        description: Enable only after confirming free artifact storage allowance
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: rymu-windows-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # Standard hosted runner only; no larger or self-hosted runners.
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CI_RELEASE_VERSION: ${{ inputs.version }}
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
      CARGO_TERM_COLOR: never
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve exact source line endings on the disposable runner
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out the reviewed source and pinned submodule
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.8'
          architecture: x64
      - name: Verify exact public source baseline and CI inputs
        run: |
          python rymu-release/ci/verify_candidate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & rymu-release/ci/windows-build.ps1 -Stage Validate -Version $env:CI_RELEASE_VERSION
      - name: Bootstrap hash-locked tools and native libraries
        run: '& rymu-release/ci/windows-build.ps1 -Stage Bootstrap -Version $env:CI_RELEASE_VERSION'
      - name: Build Rust and Flutter from this checkout
        run: '& rymu-release/ci/windows-build.ps1 -Stage Build -Version $env:CI_RELEASE_VERSION'
      - name: Run focused native and Flutter tests
        run: '& rymu-release/ci/windows-build.ps1 -Stage Test -Version $env:CI_RELEASE_VERSION'
      - name: Package and verify the unsigned MSI
        run: '& rymu-release/ci/windows-build.ps1 -Stage Package -Version $env:CI_RELEASE_VERSION'
      - name: Record source, tool and output provenance
        run: '& rymu-release/ci/windows-build.ps1 -Stage Evidence -Version $env:CI_RELEASE_VERSION'
      - name: Upload unsigned qualification artifact
        if: inputs.upload_artifacts
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rymu-windows-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rymu-release/out/*.msi
            rymu-release/out/*.zip
            rymu-release/out/*.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Preserve diagnostics, including failures
        if: always() && inputs.upload_artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rymu-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            rymu-release/out/logs/
            rymu-release/out/*.json
          if-no-files-found: ignore
          retention-days: 1

# This workflow builds and uploads qualification evidence only. It does not sign,
# publish, enable paid services, or assert SignPath acceptance. After acceptance,
# a reviewed signing job can use the unsigned step's artifact-id with the approved
# project/policy and mandatory human approval. Do not import local installer files.
